name: hunter

# The runtime.
#
# Krish's two batches are owed at Sunday 13:00 London and Thursday 08:27 UTC.
# Whether one is owed is decided by hunter itself on every drain
# (src/hunter/schedule.py), from the run record, never by when cron fires.
# GitHub's scheduler ran hours late on this repository: on Sunday 27 September
# the 12:00 UTC job started at 15:54, the London-clock guard that used to live
# here read "16:00, not 13:00" and skipped it, and that week had no batch.
#
# The clock that wakes hunter is Control Center's (api/hunter/tick.ts, a Vercel
# cron that fires on the minute and sends repository_dispatch hunter-drain).
# The six-hourly entry below is only the fallback if that stops.
#
# A button press normally arrives as a repository_dispatch and runs within a
# minute. One job at a time: two hunters on the same sheet is how rows get
# duplicated.

on:
  schedule:
    - cron: "13 */6 * * *"
  repository_dispatch:
    types: [hunter-drain, hunter-run, hunter-process, hunter-source, hunter-packages]
  workflow_dispatch:
    inputs:
      command:
        description: "hunter command"
        type: choice
        default: process
        options: [process, run, source, packages, drain, approvals, approvals-drain,
                  close-submitted, confirmations, settle, score-builds, rebuild-packages, rerank, judge-eval, screen-eval, blind-set, blind-eval, applied, stats, prune-sheet, bridges,
                  reconcile, recon, verify, retire, unretire,
                  door-coverage, door-cards, drafts, actions, facts, letter-master, cv-master,
                  build-preview, doc-edits, bank-seed, drive-map, drive-sweep]
      extra:
        description: "extra arguments, for example --max 2 or --apply"
        type: string
        default: ""

concurrency:
  group: hunter
  cancel-in-progress: false

jobs:
  hunter:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # The browser extra and Chromium, for the steps that can fill a form. Only
      # submit and the approval prefill need them; installing once here is simpler
      # than branching, and a sourcing run that never opens a browser pays about a
      # minute for it.
      - run: pip install -e ".[browser]"
      - run: python -m playwright install --with-deps chromium
      - name: Pick the command
        id: cmd
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          ACTION: ${{ github.event.action }}
          COMMAND_ID: ${{ github.event.client_payload.command_id }}
          INPUT_COMMAND: ${{ inputs.command }}
          INPUT_EXTRA: ${{ inputs.extra }}
        run: |
          SKIP=""
          if [ "$EVENT" = "schedule" ]; then
            # Every scheduled tick is a drain. The drain decides for itself
            # whether a full run is owed (schedule.py).
            ARGS="drain"
          elif [ "$EVENT" = "repository_dispatch" ]; then
            if [ -n "$COMMAND_ID" ]; then ARGS="drain --id $COMMAND_ID"; else ARGS="${ACTION#hunter-}"; fi
          else
            # No extra means no separator. "drain " with a trailing space is not
            # equal to "drain", and every step below that writes his submissions
            # to the sheet is gated on exactly that string, so a hand dispatch of
            # drain ran the command and silently skipped all four of them.
            ARGS="$INPUT_COMMAND${INPUT_EXTRA:+ $INPUT_EXTRA}"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          if [ -n "$SKIP" ]; then
            echo "skipping: $SKIP"
          else
            echo "running: python -u -m hunter.run $ARGS"
          fi
      - name: Run hunter
        if: steps.cmd.outputs.skip == ''
        run: python -u -m hunter.run ${{ steps.cmd.outputs.args }}

      # Every edit he makes to a letter or CV hunter built, words and
      # formatting (src/hunter/docedits.py, his ruling 2026-10-15). Before the
      # replies, so an edit made after the Apply email cancels the waiting
      # application and Prepare sends his version. Counts only.
      # A failure here never stops the replies below: they still need the
      # main command to have succeeded, and only that.
      - name: Read his edits to letters and CVs
        if: steps.cmd.outputs.args == 'drain'
        continue-on-error: true
        run: python -u -m hunter.run doc-edits --apply

      # Krish's replies, read and acted on every hour. approvals-drain was written
      # and never scheduled, so an APPROVE waited in the inbox until someone ran it
      # by hand. --send is what makes one approval enough: he approved a picture of
      # the completed form, and submit's own gate still refuses on a changed plan.
      #
      # Only on the hourly tick and only when the main command succeeded, so a
      # broken run never reaches the step that can submit an application.
      - name: Read approval replies
        if: steps.cmd.outputs.args == 'drain'
        # An APPROVE moves the token to approved. He opens the filled form
        # from Control Center or the email; his extension fills it and he
        # presses Submit. Pressing from a datacentre browser was built once
        # and refused by an invisible bot check, and is retired.
        run: python -u -m hunter.run approvals-drain --apply

      # Krish presses Submit in his own browser; the extension tells Control
      # Center and Control Center marks the row. This is the half that touches
      # the sheet, because the sheet needs Google credentials that have no
      # business being in a browser. Idempotent, so running it hourly is free.
      - name: Write submitted applications to the sheet
        if: ${{ !cancelled() && steps.cmd.outputs.args == 'drain' }}
        run: python -u -m hunter.run close-submitted --apply

      - name: Close applications the employer has acknowledged
        if: ${{ !cancelled() && steps.cmd.outputs.args == 'drain' }}
        run: python -u -m hunter.run confirmations --apply

      # What he pressed in Control Center (src/hunter/actions.py): a verdict is
      # written to column A as the words he would have typed, so the settle
      # step below records it in this same pass; "prepare" sends him the
      # filled application to press. Before settle on purpose.
      - name: Apply what he pressed in Control Center
        if: ${{ !cancelled() && steps.cmd.outputs.args == 'drain' }}
        run: python -u -m hunter.run actions --apply

      # Column A, acted on within the hour: what he marked Applied or Declined
      # is recorded, his edits to those rows are read, any approval still open
      # for a role he applied to is closed, and the rows move to the Applied
      # tab. Until 2026-10-03 nothing hourly read column A, so a role he marked
      # Applied sat on Pipeline as live work until the next full run.
      - name: Settle what he decided
        if: ${{ !cancelled() && steps.cmd.outputs.args == 'drain' }}
        run: python -u -m hunter.run settle --apply

      # His Krish Score builds the package: 7 or more, on a row column A leaves
      # undecided (his ruling 2026-10-13). A few an hour (system_config
      # hunter_max_score_builds_per_run, 3 unless set), never inside the batch
      # run, which builds column A Yes only. After settle on purpose: settle is
      # where a score he lowered below 7 cancels what was waiting on him for
      # it, so this never builds on a score he has just taken back. Each build
      # asks the writing routine for its letter, never a model, and builds
      # once it is written; one that was refused is not tried again until
      # his score, its link or the masters change. This log carries counts
      # only, because a role built here is a role he scored 7 or more.
      - name: Build what he scored 7 or more
        if: ${{ !cancelled() && steps.cmd.outputs.args == 'drain' }}
        run: python -u -m hunter.run score-builds --apply

      # Posted (his ask 2026-10-20, "mark a bit more clearly which ones are
      # fresh"): FRESH falls away after seven days and a date found since
      # fills a row that said unknown. Only the Posted cell is written, RAW,
      # and read back. Counts only.
      - name: Keep Posted true
        if: ${{ !cancelled() && steps.cmd.outputs.args == 'drain' }}
        continue-on-error: true
        run: python -u -m hunter.run posted-refresh --apply

      # His house style for every package he still wants that was built before
      # it (his yes, 2026-10-15). Each role's letter is asked of the writing
      # routine and built here in a later hour, once it is written and passes
      # its check; a package already in his style is never chosen, so once all
      # are done this reads the sheet and builds nothing. No model is called:
      # the letters are the routine's, on his subscription. Counts only.
      - name: Bring every package he still wants into his house style
        if: ${{ !cancelled() && steps.cmd.outputs.args == 'drain' }}
        continue-on-error: true
        run: python -u -m hunter.run rebuild-packages --reason style --apply

      # A personal line a letter needs (src/hunter/facts.py, his ruling
      # 2026-10-15): asks are mailed to him, one per kind of business, and his
      # reply is written to canon 9.14 exactly as he wrote it, confirmed back
      # to him and taken back on UNDO. This log carries counts only.
      - name: Ask for and write his personal lines
        if: ${{ !cancelled() && steps.cmd.outputs.args == 'drain' }}
        run: python -u -m hunter.run facts --apply

      # Prose the writing routine left for hunter (src/hunter/drafts.py): each
      # answer is checked with the API path's validator and the voice gate and
      # only then used; one the routine never answered falls back to the API
      # under the monthly ceiling. With hunter_writer at "api" there is nothing
      # queued and this reads one empty table.
      - name: Use the writing routine's checked drafts
        if: ${{ !cancelled() && steps.cmd.outputs.args == 'drain' }}
        run: python -u -m hunter.run drafts --apply

      # Nothing lands loose in his Drive (src/hunter/drivemap.py, his ruling
      # 2026-10-18): anything new at the top of it, from any app or session,
      # is filed into Inbox from My AI, read back, and he is told in one
      # line. His own top-level items, FamilyContentLibrary and KeePass are never touched,
      # and nothing is deleted. This log carries counts only.
      - name: File anything loose at the top of his Drive
        if: ${{ !cancelled() && steps.cmd.outputs.args == 'drain' }}
        continue-on-error: true
        run: python -u -m hunter.run drive-sweep --apply

      # Is the loop still turning. Reads only, and every condition is
      # deduplicated on the condition rather than the moment, so running this
      # every hour sends at most one mail per distinct problem.
      - name: Tell him when the loop has stopped
        if: ${{ !cancelled() && steps.cmd.outputs.args == 'drain' }}
        run: python -u -m hunter.run watchdog --send

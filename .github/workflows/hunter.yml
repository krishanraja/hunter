name: hunter

# The runtime. Mon and Thu 08:27 UTC is the full run (process, then source).
# The hourly drain is the fallback for the Control Center buttons; a button
# press normally arrives as a repository_dispatch and runs within a minute.
# One job at a time: two hunters on the same sheet is how rows get duplicated.

on:
  schedule:
    - cron: "27 8 * * 1,4"
    - cron: "13 * * * *"
  repository_dispatch:
    types: [hunter-process, hunter-source, hunter-packages]
  workflow_dispatch:
    inputs:
      command:
        description: "hunter command"
        type: choice
        default: process
        options: [process, run, source, packages, drain, approvals, approvals-drain, submit,
                  bridges, reconcile, recon, migrate-columns]
      extra:
        description: "extra arguments, for example --max 2 or --apply"
        type: string
        default: ""

concurrency:
  group: hunter
  cancel-in-progress: false

jobs:
  hunter:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # The browser extra and Chromium, for the steps that can fill a form. Only
      # submit and the approval prefill need them; installing once here is simpler
      # than branching, and a sourcing run that never opens a browser pays about a
      # minute for it.
      - run: pip install -e ".[browser]"
      - run: python -m playwright install --with-deps chromium
      - name: Pick the command
        id: cmd
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          ACTION: ${{ github.event.action }}
          COMMAND_ID: ${{ github.event.client_payload.command_id }}
          INPUT_COMMAND: ${{ inputs.command }}
          INPUT_EXTRA: ${{ inputs.extra }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SCHEDULE" = "27 8 * * 1,4" ]; then ARGS="run"; else ARGS="drain"; fi
          elif [ "$EVENT" = "repository_dispatch" ]; then
            if [ -n "$COMMAND_ID" ]; then ARGS="drain --id $COMMAND_ID"; else ARGS="${ACTION#hunter-}"; fi
          else
            ARGS="$INPUT_COMMAND $INPUT_EXTRA"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "running: python -m hunter.run $ARGS"
      - name: Run hunter
        run: python -m hunter.run ${{ steps.cmd.outputs.args }}

      # Krish's replies, read and acted on every hour. approvals-drain was written
      # and never scheduled, so an APPROVE waited in the inbox until someone ran it
      # by hand. --send is what makes one approval enough: he approved a picture of
      # the completed form, and submit's own gate still refuses on a changed plan.
      #
      # Only on the hourly tick and only when the main command succeeded, so a
      # broken run never reaches the step that can submit an application.
      - name: Read approval replies
        if: steps.cmd.outputs.args == 'drain'
        run: python -m hunter.run approvals-drain --apply --send
